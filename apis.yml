description: >-
  Workerbase is a Munich-based connected-worker platform — a frontline execution layer for
  manufacturing that bridges ERP/MES planning and shopfloor operations with digital work
  instructions, dynamic task orchestration, quality and maintenance workflows, material
  logistics, an industrial smartwatch, and AI agents for the shopfloor. Its per-tenant
  platform API is reachable through a first-party JavaScript SDK and Node-RED nodes published
  on npm, covering tasks, users, roles, skills, locations, media, databases, connectors, and
  functions; customer documentation lives in a login-gated help center.
